name: MariaDB isolated staging gate
on:
  workflow_call:
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mariadb-schema:
    runs-on: ubuntu-latest
    # This container database is disposable and has ZERO production credentials.
    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MARIADB_ROOT_PASSWORD: ci_only_disposable_root
          MARIADB_DATABASE: itmap_ci
          MARIADB_USER: itmap_ci
          MARIADB_PASSWORD: ci_only_disposable_writer
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Confirm synthetic fixture matches source baseline and has no rows
        run: |
          python3 scripts/check-ci-schema.py
          python3 scripts/check-ci-smoke-seed.py
          python3 scripts/check-public-repo.py
      - name: Load empty schema ONLY into disposable CI database
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root itmap_ci < db/testdata/empty-schema.sql
          docker exec '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root itmap_ci -e \
            "CREATE USER 'itmap_readonly_ci'@'%' IDENTIFIED BY 'ci_only_disposable_reader'; GRANT SELECT ON itmap_ci.* TO 'itmap_readonly_ci'@'%';"
      - name: Bind disposable database to this CI run
        shell: bash
        run: |
          set -euo pipefail
          # Generate a new run-only marker. No real data, credentials or dumps.
          # The original schema requires a 36-character generation UUID.
          disposable_generation="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          echo "ITMAP_TEST_DISPOSABLE_GENERATION=$disposable_generation" >> "$GITHUB_ENV"
          docker exec '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root itmap_ci -e \
            "INSERT INTO app_runtime_generation(id, generation) VALUES(1, '$disposable_generation')"
      - name: Verify imported foreign keys and triggers exist in MariaDB
        shell: bash
        run: |
          set -euo pipefail
          fk_count="$(docker exec '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root --batch --skip-column-names itmap_ci -e \
            "SELECT COUNT(*) FROM information_schema.TABLE_CONSTRAINTS WHERE CONSTRAINT_SCHEMA = 'itmap_ci' AND CONSTRAINT_TYPE = 'FOREIGN KEY'")"
          trigger_count="$(docker exec '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root --batch --skip-column-names itmap_ci -e \
            "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = 'itmap_ci'")"
          [[ "$fk_count" == 50 ]] || { echo "Expected 50 foreign keys, found $fk_count" >&2; exit 1; }
          [[ "$trigger_count" == 22 ]] || { echo "Expected 22 triggers, found $trigger_count" >&2; exit 1; }
      - name: Verify locked MariaDB driver dependencies without modifying manifests
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch go.sum >/dev/null
          go mod download
          go mod verify
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
      - name: Verify empty-schema storage, rollback and locking semantics
        env:
          ITMAP_REQUIRE_MARIADB_INTEGRATION: '1'
          ITMAP_TEST_MARIADB_DSN: 'itmap_readonly_ci:ci_only_disposable_reader@tcp(127.0.0.1:3306)/itmap_ci?parseTime=true&collation=utf8mb4_bin'
          ITMAP_TEST_MARIADB_WRITE_DSN: 'itmap_ci:ci_only_disposable_writer@tcp(127.0.0.1:3306)/itmap_ci?parseTime=true&clientFoundRows=true&collation=utf8mb4_bin'
        run: |
          set -euo pipefail
          # All storage tests run before business data; rollback requires an
          # empty agency_identity. Missing DSNs are failures, not skips.
          go test -tags mariadb ./internal/storage -count=1 -v
      - name: Seed synthetic catalog and business read models
        shell: bash
        run: |
          set -euo pipefail
          # Schema-only tests have finished. Seed only the disposable itmap_ci
          # container, never the private D1/MariaDB dump or a shared staging DB.
          docker exec -i '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root itmap_ci < db/testdata/smoke-catalog.sql
          docker exec -i '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root itmap_ci < db/testdata/read-models.sql
          rows="$(docker exec '${{ job.services.mariadb.id }}' mariadb \
            -u root -pci_only_disposable_root --batch --skip-column-names itmap_ci -e \
            'SELECT COUNT(*) FROM app_catalog WHERE id=1')"
          [[ "$rows" == 1 ]] || { echo 'Synthetic catalog seed failed' >&2; exit 1; }
      - name: Verify business reads against synthetic MariaDB data
        env:
          ITMAP_REQUIRE_MARIADB_INTEGRATION: '1'
          ITMAP_TEST_SYNTHETIC_READS: '1'
          ITMAP_TEST_MARIADB_DSN: 'itmap_readonly_ci:ci_only_disposable_reader@tcp(127.0.0.1:3306)/itmap_ci?parseTime=true&collation=utf8mb4_bin'
        shell: bash
        run: |
          set -euo pipefail
          # Cover every other internal package. Storage already ran on the
          # empty schema above; no test is disabled or silently filtered out.
          all_packages="$(go list -tags mariadb ./internal/...)"
          packages=()
          while IFS= read -r package; do
            if [[ "$package" != itmap/internal/storage ]]; then packages+=("$package"); fi
          done <<< "$all_packages"
          go test -tags mariadb "${packages[@]}" -count=1 -v
          CGO_ENABLED=0 go build -trimpath -tags mariadb -o /tmp/itmap-mariadb ./cmd/itmap
      - name: Verify durable and concurrent receipt writes ONLY in disposable CI
        env:
          ITMAP_REQUIRE_MARIADB_INTEGRATION: '1'
          ITMAP_TEST_MARIADB_WRITE_DSN: 'itmap_ci:ci_only_disposable_writer@tcp(127.0.0.1:3306)/itmap_ci?parseTime=true&clientFoundRows=true&collation=utf8mb4_bin'
        run: |
          set -euo pipefail
          # The complete empty-schema suite and readonly business tests already
          # ran. This additional tagged business gate commits only guarded
          # synthetic Demo rows and removes them before HTTP/browser smoke.
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          go test -race -tags mariadb,receiptwrites ./internal/storage -run '^TestMariaDBApplication(Receipts|Concurrency|Faults|Crash|CAS|HTTP)Disposable$' -count=1 -json | tee "$result_file"
          python3 - "$result_file" <<'PY'
          import json,sys
          events=[json.loads(line) for line in open(sys.argv[1],encoding='utf8')]
          targets=['TestMariaDBApplicationReceiptsDisposable','TestMariaDBApplicationConcurrencyDisposable','TestMariaDBApplicationFaultsDisposable','TestMariaDBApplicationCrashDisposable','TestMariaDBApplicationCASDisposable','TestMariaDBApplicationHTTPDisposable']
          for target in targets:
              assert any(e.get('Test')==target and e.get('Action')=='pass' for e in events), f'required receipt test did not pass/run: {target}'
          assert not any(e.get('Action')=='skip' for e in events), 'required receipt test was skipped'
          print('PASS: durable receipt write gate ran with zero skips')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build SPA and install pinned Chromium for browser smoke
        run: |
          npm ci --no-audit --no-fund
          npm run build:web
          npx playwright install --with-deps --only-shell chromium
      - name: Smoke the running Go server against disposable MariaDB
        env:
          APP_ENV: staging
          HTTP_ADDR: 127.0.0.1:18080
          WEB_DIST_DIR: ${{ github.workspace }}/dist/web
          ITMAP_BROWSER_URL: http://127.0.0.1:18080
          DB_ENABLED: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: itmap_ci
          DB_USER: itmap_readonly_ci
          DB_PASSWORD: ci_only_disposable_reader
          AUTH_ENABLED: 'true'
          SESSION_SECRET: 'CI_SYNTHETIC_SESSION_SECRET_NOT_FOR_PRODUCTION_2026'
          SITE_PASSWORD: 'CI_SYNTHETIC_ACCOUNT_PASSWORD_NOT_FOR_PRODUCTION'
          NASTYA_PASSWORD: 'CI_SYNTHETIC_ACCOUNT_PASSWORD_NOT_FOR_PRODUCTION'
          DEMO_PASSWORD: 'CI_SYNTHETIC_ACCOUNT_PASSWORD_NOT_FOR_PRODUCTION'
          ITMAP_SMOKE_AUTH: '1'
          ITMAP_SMOKE_LOGIN: 'eugene'
          ITMAP_SMOKE_PASSWORD: 'CI_SYNTHETIC_ACCOUNT_PASSWORD_NOT_FOR_PRODUCTION'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          /tmp/itmap-mariadb >"$log_file" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; rm -f "$log_file"' EXIT
          for i in {1..30}; do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18080/health/live >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Go server stopped before staging smoke test' >&2
              exit 1
            fi
            sleep 1
          done
          bash scripts/staging-smoke.sh http://127.0.0.1:18080
          npm run test:browser
          python3 deploy/tests/native_smoke.py
      - name: Ensure dependency manifest remains tracked and unchanged
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch go.sum >/dev/null 2>&1; then
            echo '::error::go.sum is not committed. Review the uploaded checksum artifact and commit it through a PR.'
            exit 1
          fi
          git diff --exit-code -- go.mod go.sum
          test -s go.sum
