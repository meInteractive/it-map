name: GO114 temporary API coverage regeneration
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'codex/GO-114-formatter-changed-files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Повторно сверить API-инвентарь после чистого форматирования
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const file='docs/dev/API_COVERAGE_REVIEW.json';
          const review=JSON.parse(readFileSync(file,'utf8'));
          review.sourceHashes['frontend/api/client.ts']=createHash('sha256').update(readFileSync('frontend/api/client.ts')).digest('hex');
          writeFileSync(file,JSON.stringify(review,null,2)+'\n');
          NODE
          node scripts/check-api-coverage.mjs --write
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const previous=JSON.parse(execFileSync('git',['show','HEAD:docs/dev/API_CALLSITES.json'],{encoding:'utf8'}));
          const current=JSON.parse(readFileSync('docs/dev/API_CALLSITES.json','utf8'));
          function stable(list){return list.map(({file,call,method,literalFragments,families,dynamicURL})=>({file,call,method,literalFragments,families,dynamicURL}));}
          for(const name of ['sites','bindings','forwarders']){
            assert.deepEqual(stable(current[name]),stable(previous[name]),name+' API method/source/family or callsite order changed');
          }
          assert.equal(current.files,previous.files,'TS/TSX file count changed');
          assert.equal(current.transportModule,previous.transportModule);
          console.log('GO114_API_INVENTORY_STABLE '+current.files+' files, '+current.sites.length+' calls');
          const changed=execFileSync('git',['diff','--name-only','-z','HEAD','--','docs/dev/API_CALLSITES.json','docs/dev/API_COVERAGE_REVIEW.json','docs/dev/API_COVERAGE.md'],{encoding:'utf8'}).split('\0').filter(Boolean);
          for(const file of changed){
            console.log('GO114API '+file+' '+readFileSync(file).toString('base64'));
          }
          console.log('GO114API_TOTAL '+changed.length);
          NODE
