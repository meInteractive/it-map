name: Public source security and Go checks
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  safe-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public files for prohibited data and token formats
        run: python3 scripts/check-public-repo.py
      - name: Test isolated release receiver state, archives and rollback
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Audit full reachable Git history without exposing values
        run: |
          python3 scripts/test_git_history.py
          python3 scripts/check-git-history.py
      - name: Verify no private payloads tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(.*(dump|backup|secret|credential|\.env)|\.openai/|dist/)' | grep -vE '(^|/)\.env\.example$|(^|/)\.dev\.vars\.example$|server/generated/backup-schema\.json|docs/BACKUP_FORMAT\.md|server/backup/index\.js|scripts/test-backup-|server/import-export/database-dump\.js|^scripts/(backup-schema|test-database-dump)\.mjs$|^internal/backup/[a-z_]+\.go$'; then
            echo 'Unexpected sensitive-looking tracked path requires manual review'
            exit 1
          fi
  go:
    runs-on: ubuntu-latest
    needs: safe-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate all workflow syntax and reusable calls
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -race ./...
      - name: Set up Node for required synthetic crypto interoperability
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify Go encryption with unchanged legacy JS decryption
        run: go test -race -tags legacyinterop ./internal/legacycrypto -count=1
      - name: Verify scheduler claim billing and exact JSON page keys against SQLite source
        run: go test -race -tags legacyinterop ./internal/parser -run '^TestScheduler(Claim|JSON|Score|Billing)Source$' -count=1
      - name: Verify Go v39 layout integrity and formatting against unchanged legacy JS
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyV39Contract$' -count=1
      - name: Verify signed historical v16-38 layouts with unchanged legacy JS
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyHistoricalFormat$' -count=1
      - name: Verify unsigned v14-15 validation with unchanged legacy JS and zero SQL
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyUnsignedFormat$' -count=1
      - name: Verify legacy catalog entity fields with unchanged JS and zero SQL
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyCatalogEntities$' -count=1
      - name: Verify pure normalized catalog list map detail against unchanged source
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestCatalogReadProjectionSource$' -count=1
      - name: Verify pure source catalog search coercion and Unicode lower
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestCatalogSearchSource$' -count=1
      - name: Verify publication dates periods and Moscow boundaries against unchanged source
        run: go test -race -tags legacyinterop ./internal/vacancies -run '^TestPublicationPeriodSource$' -count=1
      - name: Reproduce pinned ICU Russian collation data from public Unicode mappings
        run: node scripts/collation/generate.mjs
      - name: Verify canonical Russian order against pinned Node and accepted exceptions
        run: go test -race -tags legacyinterop ./internal/rucollation -run '^TestRussianCollationSource$' -count=1
      - name: Verify pure unsigned v14-15 plans preserve omissions without enabling runtime
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyUnsigned(Plan|SQLPlan)$' -count=1
      - name: Verify hiring contact validation against unchanged legacy JS
        run: go test -race -tags legacyinterop ./internal/contacts -run '^TestLegacyContactInput$' -count=1
      - name: Verify channel order and duplicate checks against unchanged SQLite source
        run: go test -race -tags legacyinterop ./internal/channels -run '^TestLegacyChannelStorageOrder$' -count=1
      - name: Verify channel catalog source projection against unchanged legacy JS
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyStoredCatalogSources$' -count=1
      - name: Verify historical v16-38 plans and Unicode policy with unchanged legacy JS
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyHistoricalPlan$' -count=1
      - name: Verify Go v39 restore plan with unchanged legacy JS and zero SQL
        run: go test -race -tags legacyinterop ./internal/backup -run '^TestLegacyV39RestorePlan$' -count=1
      - name: Verify delayed result boundary against unchanged legacy generation facade
        run: go test -race -tags legacyinterop ./internal/storage -run '^TestLegacyGenerationBoundary$' -count=1
      - name: Test read-only staging smoke contract
        run: python3 scripts/test-staging-smoke.py
      - name: Build offline-compatible migration shell
        run: go build -o /tmp/itmap ./cmd/itmap
      - name: Verify locked Go dependencies (networked CI only)
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Require committed go.sum for reproducible Go release
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch go.sum >/dev/null || {
            echo '::error::Commit reviewed go.sum in a PR before Go release acceptance'
            exit 1
          }
          test -s go.sum
          git diff --exit-code -- go.mod go.sum
      - name: Verify MariaDB-tagged build
        run: |
          go test -tags mariadb ./...
          go build -tags mariadb -o /tmp/itmap-mariadb ./cmd/itmap

  web:
    runs-on: ubuntu-latest
    needs: safe-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify synthetic creation contract against unchanged legacy JS
        run: |
          node scripts/check-api-coverage.mjs
          node scripts/check-creation-contract.mjs
          node scripts/check-task-create-contract.mjs
          node scripts/check-crm-save-contract.mjs
          node scripts/check-profile-contract.mjs
          node scripts/check-profile-storage-contract.mjs
          node scripts/check-channel-input-contract.mjs
          node scripts/check-legacy-crypto.mjs
          node scripts/check-parser-settings-contract.mjs
          node scripts/check-parser-budget-contract.mjs
          node scripts/check-scheduler-run-contract.mjs
          node scripts/check-apify-transport-contract.mjs
      - run: npm run build:web
