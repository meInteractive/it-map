name: GO-114 temporary mechanical formatter export
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'codex/GO-114-formatter-changed-files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Создать чистый механический Prettier diff
        run: |
          npx prettier --write "frontend/**/*.{ts,tsx}" "shared/**/*.{ts,tsx,mts}" web/main.tsx vite.web.config.ts
          npx prettier --check "frontend/**/*.{ts,tsx}" "shared/**/*.{ts,tsx,mts}" web/main.tsx vite.web.config.ts
      - name: Экспортировать только изменённые публичные TS-файлы для переноса через Git API
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          const changed=execFileSync('git',['diff','--name-only','-z','--diff-filter=ACMR','HEAD','--','frontend','shared','web/main.tsx','vite.web.config.ts'],{encoding:'utf8'}).split('\0').filter(Boolean);
          for(const file of changed){
            if(!/^(?:frontend\/.*\.(?:ts|tsx)|shared\/.*\.(?:ts|tsx|mts)|web\/main\.tsx|vite\.web\.config\.ts)$/.test(file))throw new Error('Unexpected path: '+file);
            console.log('GO114FILE '+file+' '+readFileSync(file).toString('base64'));
          }
          console.log('GO114TOTAL '+changed.length);
          NODE
